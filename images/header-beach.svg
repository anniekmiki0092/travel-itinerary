<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241b3d"/>
      <stop offset="60%" stop-color="#4a3168"/>
      <stop offset="100%" stop-color="#c98a63"/>
    </linearGradient>
    <linearGradient id="jungleSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe7ad"/>
      <stop offset="100%" stop-color="#bfe8a8"/>
    </linearGradient>
    <linearGradient id="lagoon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fe9d8"/>
      <stop offset="100%" stop-color="#049c8c"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fef3d0"/>
      <stop offset="100%" stop-color="#bfe6e0"/>
    </linearGradient>
  </defs>

  <!-- 1) 都会の夜景（クアラルンプール風） -->
  <rect x="0" y="0" width="290" height="300" fill="url(#nightSky)"/>
  <circle cx="55" cy="55" r="18" fill="#fff6d8" opacity="0.85"/>
  <g fill="#160f28">
    <rect x="0" y="180" width="35" height="120"/>
    <rect x="30" y="150" width="30" height="150"/>
    <rect x="150" y="160" width="34" height="140"/>
    <rect x="190" y="130" width="26" height="170"/>
    <rect x="245" y="170" width="45" height="130"/>
  </g>
  <!-- ペトロナスツインタワー風シルエット -->
  <g fill="#0e0a1c">
    <path d="M95,300 L95,120 L100,95 L105,120 L105,300 Z"/>
    <path d="M120,300 L120,110 L125,85 L130,110 L130,300 Z"/>
    <rect x="103" y="150" width="20" height="8"/>
  </g>
  <g fill="#ffd77a" opacity="0.8">
    <rect x="8" y="200" width="5" height="6"/><rect x="18" y="220" width="5" height="6"/>
    <rect x="36" y="170" width="5" height="6"/><rect x="46" y="200" width="5" height="6"/>
    <rect x="155" y="190" width="5" height="6"/><rect x="168" y="220" width="5" height="6"/>
    <rect x="196" y="160" width="5" height="6"/><rect x="206" y="200" width="5" height="6"/>
    <rect x="252" y="200" width="5" height="6"/><rect x="266" y="230" width="5" height="6"/>
    <rect x="98" y="180" width="4" height="6"/><rect x="98" y="220" width="4" height="6"/>
    <rect x="123" y="170" width="4" height="6"/><rect x="123" y="210" width="4" height="6"/>
  </g>

  <!-- 2) ジャングルと川 -->
  <rect x="290" y="0" width="230" height="300" fill="url(#jungleSky)"/>
  <g fill="#12693f" opacity="0.9">
    <ellipse cx="330" cy="120" rx="70" ry="55"/>
    <ellipse cx="410" cy="100" rx="60" ry="50"/>
    <ellipse cx="480" cy="130" rx="65" ry="50"/>
  </g>
  <g fill="#1c8a54" opacity="0.9">
    <ellipse cx="350" cy="150" rx="55" ry="40"/>
    <ellipse cx="430" cy="140" rx="60" ry="42"/>
    <ellipse cx="495" cy="160" rx="50" ry="38"/>
  </g>
  <path d="M290,300 C330,230 300,190 340,160 C380,130 360,90 400,70 L520,70 L520,300 Z" fill="url(#river)" opacity="0.55"/>

  <!-- 3) ビーチ・ラグーン -->
  <rect x="520" y="0" width="280" height="170" fill="#bdeee6"/>
  <rect x="520" y="165" width="280" height="95" fill="url(#lagoon)"/>
  <path d="M520,178 Q560,160 600,176 Q640,158 690,177 L800,180 L800,190 L520,190 Z" fill="#0d6e66" opacity="0.25"/>
  <path d="M560,255 Q660,232 800,250 L800,300 L520,300 L520,268 Q540,258 560,255 Z" fill="#ffe9c2"/>
  <!-- 椰子の木 -->
  <g transform="translate(760,300)">
    <path d="M0,0 C-4,-55 6,-100 24,-135" stroke="#2e2118" stroke-width="9" fill="none" stroke-linecap="round"/>
    <g fill="#0b5c50">
      <path d="M24,-135 C-8,-148 -35,-135 -48,-108 C-18,-122 4,-127 24,-135 Z"/>
      <path d="M24,-135 C0,-160 -18,-182 -13,-205 C10,-182 22,-160 24,-135 Z"/>
      <path d="M24,-135 C48,-157 78,-157 96,-140 C64,-144 42,-142 24,-135 Z"/>
      <path d="M24,-135 C52,-126 74,-104 80,-82 C52,-104 34,-122 24,-135 Z"/>
    </g>
  </g>
</svg>
